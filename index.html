<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#192b56" />
    <meta name="description" content="SAI 동아리방 앱 프론트엔드 프로토타입" />
    <title>SAI ROOM · 우리 동아리방</title>
    <link rel="icon" href="assets/sai-logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/data.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body data-theme="light">
    <aside class="desktop-intro">
      <p class="eyebrow">SEJONG ARTIFICIAL INTELLIGENCE</p>
      <h2>우리의 공간,<br />더 가까이.</h2>
      <p>동아리방의 지금을 확인하고<br />함께 쓰는 시간을 만들어보세요.</p>
      <div class="desktop-brand-line"></div>
      <span class="prototype-label">SAI ROOM · FRONTEND PREVIEW</span>
      <p class="desktop-caption">
        화면 속 버튼을 눌러 체험해보세요.<br />변경한 내용은 이 브라우저에
        저장됩니다.
      </p>
    </aside>
    <div id="app" class="app-shell">
      <header class="app-header" id="header"></header>
      <main class="view" id="view" tabindex="-1"></main>
      <nav class="bottom-nav" id="nav" aria-label="주요 메뉴"></nav>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog
      class="confirm-dialog"
      id="confirm-dialog"
      aria-labelledby="confirm-title"
    >
      <h2 id="confirm-title">확인</h2>
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button class="secondary-button" id="confirm-no">돌아가기</button
        ><button class="danger-button" id="confirm-yes">확인</button>
      </div>
    </dialog>
    <noscript>이 앱을 체험하려면 브라우저의 JavaScript를 켜주세요.</noscript>
  </body>
</html>
